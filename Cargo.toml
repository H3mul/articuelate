[package]
name = "articuelate"
version = "0.1.0"
edition = "2024"
default-run = "articuelate"
description = "Articuelate - a native, Floem-based audio cue system inspired by Lapce"

[features]
default = ["debug-ui"]
debug-ui = ["dep:serde_json"]

[dependencies]
floem = { git = "https://github.com/lapce/floem", rev = "778bb5", features = ["tokio", "crossbeam"] }
fastrand = "2"
im = "15"
lucide-floem = { git = "https://github.com/H3mul/lucide-floem.git", rev = "333af3b" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
cpal = "0.15"
ringbuf = "0.4"
rodio = "0.19"
toml = "0.8"
uuid = { version = "1.24.0", features = ["v7", "serde"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
yaml_serde = "0.10.4"
serde_json = { version = "1.0.151", optional = true }
arc-swap = "1.9.2"
crossbeam-channel = "0.5.16"
notify = { version = "7", default-features = false, features = ["macos_kqueue"] }
serde_with = "3.21.0"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }

[patch.crates-io]
floem = { git = "https://github.com/lapce/floem", rev = "778bb5" }
